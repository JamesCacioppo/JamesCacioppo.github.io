baseURL = "https://jamescacioppo.github.io/"
title = "Modern Engineer"
contentDir = "content/en"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
enableMissingTranslationPlaceholders = true
enableRobotsTXT = true
enableGitInfo = true
disableKinds = ["RSS"]

[taxonomies]
tag = "tags"
category = "categories"

[permalinks]
blog = "/:section/:year/:month/:day/:slug/"

[imaging]
resampleFilter = "CatmullRom"
anchor = "smart"
  [imaging.webp]
  quality = 75
  [imaging.jpeg]
  quality = 75

[languages.en]
label = "English"
weight = 1
  [languages.en.params]
  description = "The Modern Engineer"

[markup.goldmark.parser.attribute]
block = true

# Existing pages contain intentional HTML and Docsy block shortcodes.
[markup.goldmark.renderer]
unsafe = true

[markup.highlight]
# Let Docsy's light/dark styles control syntax colors instead of inline styles.
noClasses = false

# The About section is authored as HTML. Hugo 0.166 blocks HTML content
# files by default; keep that existing page enabled.
[security]
allowContent = ['! ^text/org$']

# Keep the existing printable section pages.
[outputs]
section = ["HTML", "print"]

# Keep print pages under each section, as in the original site.
[outputFormats.print]
path = ""
baseName = "_print/index"
mediaType = "text/html"
isHTML = false
permalinkable = false

[params]
github_repo = "https://github.com/JamesCacioppo/JamesCacioppo.github.io"
github_project_repo = "https://github.com/JamesCacioppo/JamesCacioppo.github.io"
github_branch = "main"
offlineSearch = false

[params.taxonomy]
taxonomyCloud = ["tags", "categories"]
taxonomyCloudTitle = ["Tag Cloud", "Categories"]
taxonomyPageHeader = ["tags", "categories"]

[params.copyright]
authors = "James Cacioppo | [CC BY 4.0](https://creativecommons.org/licenses/by/4.0)"
from_year = 2022

[params.ui]
navbar_logo = false
showLightDarkModeMenu = true

[params.ui.feedback]
enable = false

[params.ui.readingtime]
enable = false

[[params.links.developer]]
name = "GitHub"
url = "https://github.com/JamesCacioppo/JamesCacioppo.github.io"
icon = "fab fa-github"
desc = "Development takes place here!"

[module.hugoVersion]
extended = true
min = "0.166.0"

[[module.imports]]
path = "github.com/docsy/docsy/theme"
